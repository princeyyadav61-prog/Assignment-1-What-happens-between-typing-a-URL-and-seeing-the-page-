<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="Student Registration Form – Prince Yadav – HTML & CSS course assignment">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form – Prince Yadav</title>
   
</head>
<body>
    <main>
        <header>
            <h1>Student Registration Form</h1>
            <p>Please fill out the details below to complete your academic enrollment.</p>
        </header>

        <form action="#" method="POST">
            <!-- Personal Information Section -->
            <fieldset>
                <legend>Personal Information</legend>

                <div class="form-group">
                    <label for="fullname">Full Name:</label>
                    <input type="text" id="fullname" name="fullname" required placeholder="Enter your full legal name">
                </div>

                <div class="form-group">
                    <label for="email">Email Address:</label>
                    <input type="email" id="email" name="email" required placeholder="name@example.com">
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="9876543210">
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth:</label>
                    <input type="date" id="dob" name="dob" required>
                </div>

                <div class="form-group">
                    <label>Gender:</label>
                    <div class="radio-group">
                        <label><input type="radio" name="gender" value="male"> Male</label>
                        <label><input type="radio" name="gender" value="female"> Female</label>
                        <label><input type="radio" name="gender" value="other"> Other</label>
                    </div>
                </div>
            </fieldset>
            <fieldset>
                <legend>Academic Selection</legend>

                <div class="form-group">
                    <label for="program">Degree Program:</label>
                    <select id="program" name="program" required>
                        <option value="" disabled selected>-- Select your program --</option>
                        <option value="bca-ai">BCA Artificial Intelligence</option>
                        <option value="bca-general">BCA General</option>
                        <option value="bsc-it">BSc Information Technology</option>
                        <option value="btech-cse">BTech Computer Science</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="semester">Current Semester:</label>
                    <select id="semester" name="semester">
                        <option value="1">Semester 1</option>
                        <option value="2">Semester 2</option>
                        <option value="3">Semester 3</option>
                        <option value="4">Semester 4</option>
                        <option value="5">Semester 5</option>
                        <option value="6">Semester 6</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="bio">Short Bio / Interests:</label>
                    <textarea id="bio" name="bio" rows="4" placeholder="Briefly describe your programming or career interests..."></textarea>
                </div>
            </fieldset>

            <fieldset>
                <legend>Confirmation</legend>
                <div class="form-group checkbox-single">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">I verify that all information provided above is accurate and correct.</label>
                </div>
            </fieldset>

            <div class="button-group">
                <button type="submit">Register Now</button>
                <button type="reset">Clear Form</button>
            </div>
        </form>

        <div class="nav-link">
            <p><a href="15-personal-blog-portfolio.html">← Back to Portfolio & Blog</a></p>
        </div>
    </main>
</body>
</html>
